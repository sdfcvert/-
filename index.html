<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Platform - ホーム</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="home-page">
    <div class="hero-container">
        <div class="hero-background">
            <div class="gradient-orb orb-1"></div>
            <div class="gradient-orb orb-2"></div>
            <div class="gradient-orb orb-3"></div>
        </div>

        <header class="main-header">
            <div class="logo-section">
                <div class="logo-icon">🎮</div>
                <h1 class="platform-title">Game Platform</h1>
            </div>
            <p class="platform-subtitle">ブラウザで楽しむゲームの世界</p>
        </header>

        <main class="home-content">
            <section class="hero-section">
                <h2 class="hero-title">
                    さあ、<span class="highlight">冒険</span>を始めよう
                </h2>
                <p class="hero-description">
                    様々なジャンルのゲームを、いつでもどこでも。<br>
                    シンプルな操作で、すぐにプレイ開始。
                </p>

                <div class="cta-buttons">
                    <button class="cta-button primary" onclick="location.href='games.html'">
                        <span class="button-text">ゲームを探す</span>
                        <span class="button-icon">→</span>
                    </button>
                </div>
            </section>

            <section class="features-section">
                <div class="features-grid">
                    <div class="feature-card">
                        <div class="feature-icon-wrapper">
                            <span class="feature-icon">🎯</span>
                        </div>
                        <h3 class="feature-title">多彩なジャンル</h3>
                        <p class="feature-description">
                            パズル、アクション、戦略など<br>幅広いゲームを用意
                        </p>
                    </div>

                    <div class="feature-card">
                        <div class="feature-icon-wrapper">
                            <span class="feature-icon">⚡</span>
                        </div>
                        <h3 class="feature-title">快適な動作</h3>
                        <p class="feature-description">
                            最適化されたパフォーマンスで<br>スムーズなゲーム体験
                        </p>
                    </div>

                    <div class="feature-card">
                        <div class="feature-icon-wrapper">
                            <span class="feature-icon">🚀</span>
                        </div>
                        <h3 class="feature-title">定期的な追加</h3>
                        <p class="feature-description">
                            新しいゲームを随時追加<br>飽きることのないラインナップ
                        </p>
                    </div>
                </div>
            </section>
        </main>

        <footer class="home-footer">
            <p class="footer-text">Game Platform © 2025</p>
        </footer>
    </div>
</body>
</html>
