<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Platform - ホーム</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="home-page">
    <div class="container">
        <header class="main-header">
            <h1 class="platform-title">Game Platform</h1>
            <p class="platform-subtitle">ブラウザで楽しむゲームの世界</p>
        </header>

        <main class="home-content">
            <section class="welcome-section">
                <div class="welcome-card">
                    <h2>ようこそ</h2>
                    <p class="description">
                        このプラットフォームでは、様々なブラウザゲームをお楽しみいただけます。
                    </p>
                    <p class="description">
                        シンプルな操作で、すぐにゲームを始められます。
                    </p>
                    <div class="features">
                        <div class="feature-item">
                            <span class="feature-icon">🎮</span>
                            <span class="feature-text">多彩なゲーム</span>
                        </div>
                        <div class="feature-item">
                            <span class="feature-icon">⚡</span>
                            <span class="feature-text">快適な動作</span>
                        </div>
                        <div class="feature-item">
                            <span class="feature-icon">🌟</span>
                            <span class="feature-text">定期的な追加</span>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <div class="start-button-container">
            <button class="start-button" onclick="location.href='games.html'">
                スタート
            </button>
        </div>
    </div>
</body>
</html>
